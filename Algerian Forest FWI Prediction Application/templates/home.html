<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FWI Prediction</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 20px;
            width: 420px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .container h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            transition: 0.3s;
            font-size: 14px;
        }

        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.3);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #5a67d8;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: #f3f4f6;
            text-align: center;
            border-left: 5px solid #667eea;
        }

        .result-box h2 {
            color: #333;
            font-size: 20px;
        }

        .prediction {
            color: #667eea;
            font-size: 24px;
            font-weight: bold;
        }

        @media(max-width: 450px) {
            .container {
                width: 90%;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🔥 FWI Prediction</h1>

        <form action="{{ url_for('predict_datapoint') }}" method="post">

            <div class="input-group">
                <label>Temperature</label>
                <input type="text" name="Temperature"
                    placeholder="Enter Temperature"
                    value="{{ request.form.get('Temperature', '') }}"
                    required>
            </div>

            <div class="input-group">
                <label>RH</label>
                <input type="text" name="RH"
                    placeholder="Enter Relative Humidity"
                    value="{{ request.form.get('RH', '') }}"
                    required>
            </div>

            <div class="input-group">
                <label>Ws</label>
                <input type="text" name="Ws"
                    placeholder="Enter Wind Speed"
                    value="{{ request.form.get('Ws', '') }}"
                    required>
            </div>

            <div class="input-group">
                <label>Rain</label>
                <input type="text" name="Rain"
                    placeholder="Enter Rain Value"
                    value="{{ request.form.get('Rain', '') }}"
                    required>
            </div>

            <div class="input-group">
                <label>FFMC</label>
                <input type="text" name="FFMC"
                    placeholder="Enter FFMC"
                    value="{{ request.form.get('FFMC', '') }}"
                    required>
            </div>

            <div class="input-group">
                <label>DMC</label>
                <input type="text" name="DMC"
                    placeholder="Enter DMC"
                    value="{{ request.form.get('DMC', '') }}"
                    required>
            </div>

            <div class="input-group">
                <label>ISI</label>
                <input type="text" name="ISI"
                    placeholder="Enter ISI"
                    value="{{ request.form.get('ISI', '') }}"
                    required>
            </div>

            <div class="input-group">
                <label>Classes</label>
                <input type="text" name="Classes"
                    placeholder="Enter Class"
                    value="{{ request.form.get('Classes', '') }}"
                    required>
            </div>

            <div class="input-group">
                <label>Region</label>
                <input type="text" name="Region"
                    placeholder="Enter Region"
                    value="{{ request.form.get('Region', '') }}"
                    required>
            </div>

            <button type="submit" class="btn">
                Predict FWI
            </button>

        </form>

        <!-- Show result only after prediction -->
        {% if result %}
        <div class="result-box">
            <h2>Predicted FWI:</h2>
            <p class="prediction">{{ result }}</p>
        </div>
        {% endif %}

    </div>

</body>

</html>
